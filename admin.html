<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LAWSA Admin</title>
<style>
:root{--ink:#16231d;--green:#0f3d2e;--green2:#1c5a45;--line:#d9dfd9;--bg:#f4f6f3;--card:#fff;--gold:#b8892b;--muted:#5d6b63}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--green);color:#fff;padding:16px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
h1{margin:0;font-family:Georgia,serif;font-size:1.4rem}
main{padding:16px 0 32px}
input,select{padding:10px;border:1px solid #b9c4bc;border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
button{border:0;border-radius:6px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;background:var(--green);color:#fff}
button:hover{background:var(--green2)}
button.alt{background:#fff;color:var(--green2);border:1px solid var(--green2)}
button.bad{background:#8a1c12}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:160px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:#fff;color:var(--green2);border:1px solid var(--green2)}
.tabs button.on{background:var(--green);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card p{margin:2px 0;font-size:.93rem;word-wrap:break-word}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:700;background:#fff0c2;color:#6b5000}
.st.s-Ready,.st.s-Resolved{background:#cdeed7;color:#0c5a2b}

.st.s-Collected{background:#dde3f5;color:#26357a}
.st.s-Issue{background:#fbd5d1;color:#8a1c12}
.st.s-Payment,.st.s-In{background:#d6ecf7;color:#0b4a6b}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg{padding:10px;border-radius:6px;background:#fde8e6;border:1px solid #e3a39c;margin-bottom:10px}
.muted{color:var(--muted)}
#login{max-width:340px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
#login input{width:100%;margin:8px 0 12px}
#app{display:none}
@media (prefers-color-scheme:dark){
:root{--ink:#e8efe9;--bg:#101714;--card:#18221d;--line:#2b3a32;--muted:#9fb0a6}
input,select{background:#101714;border-color:#3b4d43}
button.alt,.tabs button{background:#18221d;color:#9fd8b6;border-color:#4c8a69}
.tabs button.on{background:#2b6b50;color:#fff}
.msg{background:#3a1f1c;border-color:#7a3a33}
}
</style>
</head>
<body>
<header><div class="wrap"><h1>LAWSA Admin</h1></div></header>
<main class="wrap">
<form id="login">
<label for="pin"><strong>Officer PIN</strong></label>
<input id="pin" type="password" autocomplete="off" required>
<button type="submit" style="width:100%">Log in</button>
<div id="lmsg" class="msg" style="display:none;margin:12px 0 0"></div>
</form>

<div id="app">
<div class="tabs">
<button id="tReq" class="on">Requests</button>
<button id="tEnq">Enquiries</button>

</div>
<div class="bar">
<input id="q" placeholder="Search name, matric or reference" aria-label="Search">
<select id="fs" aria-label="Filter by status"></select>
<button id="rf" class="alt">Refresh</button>
</div>
<div id="note" class="msg" style="display:none"></div>
<div id="list"></div>
</div>
</main>

<script>
var URL_ = "https://script.google.com/macros/s/AKfycbxZ1-sMjG9E1NhtzKKY2mWCNEAXIx5VHed918uf_DXOPO6FQ-YRUkgBMKPeR2_g2Q4STg/exec";
var pin = "", tab = "requests", data = { requests: [], enquiries: [] };
var REQ_ST = ["Pending", "Payment confirmed", "Ready", "Collected", "Issue"];
var ENQ_ST = ["New", "In progress", "Resolved"];
var $ = function (id) { return document.getElementById(id); };

function api(p) {
  var q = Object.keys(p).map(function (k) { return k + "=" + encodeURIComponent(p[k]); }).join("&");
  return fetch(URL_ + "?" + q).then(function (r) { return r.json(); });
}
function note(t) { var n = $("note"); n.textContent = t; n.style.display = t ? "block" : "none"; }
function nd(t) {
  return typeof t === "number" ? new Date(t).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }) : "";
}
function setFilter() {
  var list = tab === "requests" ? REQ_ST : ENQ_ST;
  $("fs").innerHTML = "";
  ["All"].concat(list).forEach(function (s) { var o = document.createElement("option"); o.value = s; o.textContent = s; $("fs").appendChild(o); });
  $("fs").value = tab === "requests" ? "Pending" : "New";
}

function load() {
  note("");
  return api({ action: "list", pin: pin }).then(function (x) {
    if (!x.ok) { $("lmsg").textContent = x.error; $("lmsg").style.display = "block"; $("app").style.display = "none"; $("login").style.display = "block"; return; }
    data = x; $("login").style.display = "none"; $("app").style.display = "block"; render();
  }).catch(function () { note("Could not reach the records. Check your connection and try again."); });
}
function line(c, label, v) {
  if (v === "" || v == null) return;
  var p = document.createElement("p"), b = document.createElement("strong");
  b.textContent = label + ": "; p.appendChild(b); p.appendChild(document.createTextNode(String(v))); c.appendChild(p);
}
function render() {
  var enq = tab === "enquiries", items = enq ? data.enquiries : data.requests, f = $("fs").value, q = $("q").value.trim().toLowerCase();
  var out = items.filter(function (r) {
    if (f !== "All" && r.status !== f) return false;
    return !q || [r.name, r.matric, r.ref, r.item].join(" ").toLowerCase().indexOf(q) >= 0;
  });
  var box = $("list"); box.innerHTML = "";
  if (!out.length) { var e = document.createElement("p"); e.className = "muted"; e.textContent = "Nothing here."; box.appendChild(e); return; }
  out.forEach(function (r) {
    var c = document.createElement("div"); c.className = "card";
    var h = document.createElement("strong"); h.textContent = (enq ? (r.type || "Enquiry") : (r.item || "Request")) + " (" + r.ref + ") ";
    var s = document.createElement("span"); s.className = "st s-" + r.status.split(" ")[0]; s.textContent = r.status;
    c.appendChild(h); c.appendChild(s);
    line(c, "Name", r.name); line(c, "Matric", r.matric);
    if (enq) { line(c, "Contact", r.contact); line(c, "Message", r.message); }
    else { line(c, "Fee", r.fee); line(c, "Expected", r.due); }
    line(c, "Received", nd(r.time));
    var a = document.createElement("div"); a.className = "acts";
    (enq ? ENQ_ST : REQ_ST).forEach(function (n) {
      if (n === r.status) return;

      var b = document.createElement("button"); b.textContent = n;
      b.className = n === "Issue" ? "bad" : (n === "Pending" || n === "New") ? "alt" : "";
      b.onclick = function () { b.disabled = true; setStatus(r, n); };
      a.appendChild(b);
    });
    c.appendChild(a); box.appendChild(c);
  });
}
function setStatus(r, s) {
  api({ action: "update", pin: pin, type: tab === "enquiries" ? "enquiry" : "request", ref: r.ref, status: s }).then(function (x) {
    if (!x.ok) { note("Could not update: " + x.error); render(); return; }
    r.status = s; note(""); render();
  }).catch(function () { note("Could not update. Check your connection."); render(); });
}
$("login").onsubmit = function (e) { e.preventDefault(); pin = $("pin").value; setFilter(); load(); };
$("tReq").onclick = function () { tab = "requests"; $("tReq").className = "on"; $("tEnq").className = ""; setFilter(); render(); };
$("tEnq").onclick = function () { tab = "enquiries"; $("tEnq").className = "on"; $("tReq").className = ""; setFilter(); render(); };
$("fs").onchange = render; $("q").oninput = render; $("rf").onclick = load;
setFilter();
</script>
</body>
</html>
